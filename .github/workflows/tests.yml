# Unit tests on every push and pull request - the README badge shows the result.
# Instrumented tests (Keystore, encrypted database) need an emulator and run locally only.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also checks that gradle-wrapper.jar is an official Gradle file.
      - uses: gradle/actions/setup-gradle@v6

      # No antivirus on GitHub's servers, so no JAVA_TOOL_OPTIONS trust-store workaround here.
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "*/build/reports/tests/"
